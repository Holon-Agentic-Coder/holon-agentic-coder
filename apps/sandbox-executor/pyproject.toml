# NOTE: When hitting stale code in the virtual machine/environment, perform `uv run task clean` to clean up caches and the virtual environment.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holon"
version = "0.1.0"
description = "Isolated Docker-based executor environment for Holon Agent"

[project.scripts]
holon = "sandbox_executor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_executor"]
