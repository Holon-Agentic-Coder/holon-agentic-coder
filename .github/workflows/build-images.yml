name: Build Docker Images

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Record job start time
        run: echo "CI_TIMING_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          keep-state: true

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build all Docker images
        run: |
          ./apps/sandbox-executor/build_all_images.sh --output-log

      - name: Timing gate
        run: |
          python3 scripts/ci_timing_gate.py record \
            --workflow build-images --job build --os "ubuntu-latest" --start "$CI_TIMING_START" \
            --runs 5 --tolerance 0.5 --min-delta 120 --ceiling 600 \
            --output ci-timing/record.json

      - name: Upload timing record
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-build-images-build-ubuntu-latest
          path: ci-timing/record.json
          retention-days: 30
          if-no-files-found: error
