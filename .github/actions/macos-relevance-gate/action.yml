name: "macOS Relevance Gate"
description:
  "Decides whether the macOS unit leg may skip its expensive steps because every changed file is platform-neutral"
outputs:
  skip:
    description: "'true' when the leg may skip its expensive steps; 'false' in every other case, errors included"
    value: ${{ steps.decide.outputs.skip }}
runs:
  using: "composite"
  steps:
    - name: macOS relevance gate (decide)
      id: decide
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # The script returns 0 for every decision. Anything else (no python3, a broken checkout) runs the macOS leg.
        if ! python3 -m scripts.macos_relevance; then
          echo "::warning::The macOS relevance gate could not decide; the macOS unit leg runs."
          echo "skip=false" >> "${GITHUB_OUTPUT}"
        fi
