name: Test - Hygiene

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Check uv.lock is up to date
        run: |
          uv lock --check
          git diff --exit-code uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install system linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint
          ARCH="$(dpkg --print-architecture)"
          case "${ARCH##*-}" in
            amd64) YQ_ARCH='amd64';;
            arm64) YQ_ARCH='arm64';;
            *) echo "unsupported architecture for yq"; exit 1 ;;
          esac
          sudo curl -fsSL "https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_${YQ_ARCH}" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Run Makefile lint
        run: make lint

      - name: Test clean task
        run: uv run task clean
