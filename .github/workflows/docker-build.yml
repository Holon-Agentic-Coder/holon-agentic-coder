name: Docker Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

# Pushes are keyed by SHA so a later main push never evicts a pending one.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || format('{0}-{1}', github.ref,
    github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # A push that changes only plans/, executions/ and holon-knowledge/ skips the steps below; see
      # "Bookkeeping-Only Push Gate" in .github/workflows/README.md.
      - name: Bookkeeping gate
        id: bookkeeping
        uses: ./.github/actions/bookkeeping-gate
        with:
          job-name: build

      - name: CI Timing Gate (Start)
        uses: ./.github/actions/ci-timing-gate
        with:
          phase: start

      - name: Set up QEMU
        if: steps.bookkeeping.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.bookkeeping.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4
        with:
          keep-state: true

      - name: Expose GitHub Runtime
        if: steps.bookkeeping.outputs.skip != 'true'
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build all Docker images
        if: steps.bookkeeping.outputs.skip != 'true'
        run: |
          ./apps/sandbox-executor/build_all_images.sh --output-log

      - name: CI Timing Gate (Check <= 5 min)
        if: always() && steps.bookkeeping.outputs.skip != 'true'
        uses: ./.github/actions/ci-timing-gate
        with:
          phase: check

      - name: Full run completed
        if: steps.bookkeeping.outputs.skip != 'true'
        run: echo "Every step of the full run passed."
