name: Test - Integration

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Docker cannot run on macos-latest runners (see .github/macos-docker.md)
        os: [ ubuntu-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          keep-state: true

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build all Docker images
        run: |
          ./apps/sandbox-executor/build_all_images.sh --output-log

      - name: Run integration tests
        run: |
          uv sync --locked
          uv run pytest -v -l --tb=short -m "integration_test"
