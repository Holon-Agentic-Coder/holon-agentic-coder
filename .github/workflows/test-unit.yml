name: Test - Unit

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          # Minimum absolute delta over the main baseline median before the relative gate may fail.
          # macOS runners showed a 135.2 s same-code swing (235 s vs 370.2 s), so 150 s keeps pure
          # runner variance below the gate while a real slowdown still exceeds it.
          - os: ubuntu-latest
            timing-min-delta: 120
          - os: macos-latest
            timing-min-delta: 150

    steps:
      - name: Record job start time
        run: echo "CI_TIMING_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Run unit tests
        run: |
          uv sync --locked
          uv run pytest -n auto --dist worksteal -v -l --tb=short -m "not integration_test and not stress" --junitxml=unit-report.xml

      - name: CI Timing Gate (compare with main)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TIMING_MODE: ${{ github.event_name == 'pull_request' && 'compare' || 'record' }}
          TIMING_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'timing-regression-accepted') }}
        run: |
          python3 scripts/ci_timing_gate.py "$TIMING_MODE" \
            --workflow test-unit --job unit --os "${{ matrix.os }}" --start "$CI_TIMING_START" \
            --runs 5 --tolerance 0.5 --min-delta "${{ matrix.timing-min-delta }}" --ceiling 600 \
            --junit unit-report.xml --repo "$GITHUB_REPOSITORY" --output ci-timing/record.json \
            --override-label-present "$TIMING_OVERRIDE"

      - name: Upload timing record
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-test-unit-unit-${{ matrix.os }}
          path: ci-timing/record.json
          retention-days: 30
          if-no-files-found: error
