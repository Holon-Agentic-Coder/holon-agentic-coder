name: Run Make

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Record job start time
        run: echo "CI_TIMING_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Print uname -m
        run: uname -m

      - name: Run make help
        run: make help

      - name: Run make
        run: make

      - name: Timing gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TIMING_MODE: ${{ github.event_name == 'pull_request' && 'compare' || 'record' }}
          TIMING_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'timing-regression-accepted') }}
        run: |
          python3 scripts/ci_timing_gate.py "$TIMING_MODE" \
            --workflow make --job build --os "${{ matrix.os }}" --start "$CI_TIMING_START" \
            --runs 5 --tolerance 0.5 --min-delta 120 --ceiling 600 \
            --repo "$GITHUB_REPOSITORY" --output ci-timing/record.json \
            --override-label-present "$TIMING_OVERRIDE"

      - name: Upload timing record
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-make-build-${{ matrix.os }}
          path: ci-timing/record.json
          retention-days: 30
          if-no-files-found: error
