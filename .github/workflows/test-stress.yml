name: Test - Stress

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workspace-survival:
    name: Workspace survival
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Record job start time
        run: echo "CI_TIMING_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Run workspace-survival stress suite
        # Clones the repository onto the exact path an executor works in (~/.holon-sandbox/workspace
        # with HOME redirected), runs this suite's unit selection from there, and requires the
        # workspace, its .git and its HEAD commit to survive -- the bean 0019 incident deleted the
        # workspace, which pushed executor.py into its destructive git re-initialisation. Also runs
        # the hermetic canary guard (test_sandbox_hermetic_guard.py), which re-runs the whole unit
        # selection under a simulated container HOME and is kept out of the unit matrix for runtime.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          uv sync --locked
          time uv run pytest -v -l --tb=short -m stress --junitxml=stress-report.xml

      - name: Assert the stress suite really ran
        # Non-skippable by construction: pytest exits non-zero when nothing is collected, a skipped
        # stress test reports skipped=1, and a stress test that is no longer collected is missing
        # from the named test cases; each fails here instead of passing quietly. The report is
        # parsed rather than grepped, so the check does not depend on junit attribute ordering,
        # quoting, or an extra wrapper element.
        run: |
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("stress-report.xml").getroot()
          totals = {k: 0 for k in ("tests", "skipped", "failures", "errors")}
          for suite in root.iter("testsuite"):
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          names = {case.get("name") for case in root.iter("testcase")}
          # Both stress tests must run: the workspace-survival test and the hermetic canary guard.
          expected = {
              "test_suite_run_from_live_executor_workspace_preserves_workspace_and_history",
              "test_canary_workspace_survives_entrypoint_tests",
          }

          print(f"stress report: {totals}, tests: {sorted(names)}")
          if totals["tests"] < len(expected) or expected - names:
              sys.exit(f"a stress test was not collected: missing {sorted(expected - names)}")
          if totals["skipped"]:
              sys.exit(
                  "a stress test was skipped: its workspace-survival or hermetic guarantee "
                  "was not proven"
              )
          if totals["failures"] or totals["errors"]:
              sys.exit("a stress test failed or errored")
          PY

      - name: Timing gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TIMING_MODE: ${{ github.event_name == 'pull_request' && 'compare' || 'record' }}
          TIMING_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'timing-regression-accepted') }}
        run: |
          python3 scripts/ci_timing_gate.py "$TIMING_MODE" \
            --workflow test-stress --job workspace-survival --os "${{ matrix.os }}" --start "$CI_TIMING_START" \
            --runs 5 --tolerance 0.5 --min-delta 120 --ceiling 600 \
            --junit stress-report.xml --repo "$GITHUB_REPOSITORY" --output ci-timing/record.json \
            --override-label-present "$TIMING_OVERRIDE"

      - name: Upload timing record
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-test-stress-workspace-survival-${{ matrix.os }}
          path: ci-timing/record.json
          retention-days: 30
          if-no-files-found: error
