# why: no bookkeeping gate here, since ledger-only pull requests are the ones whose ledger rows must be checked.
name: Test - Ledger Invariants

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  ledger-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # why: full history, so the merge base and the base ledger blobs exist.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: "3.13"

      - name: Check the ledger stores
        run: uv run --no-project python -m scripts.check_ledger_stores

      - name: Check ledger rows are append-only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run:
          uv run --no-project python -m scripts.check_ledger_rows_append_only --base "${BASE_SHA}" --head "${HEAD_SHA}"
