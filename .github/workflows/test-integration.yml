name: Test - Integration

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

# Pushes are keyed by SHA so a later main push never evicts a pending one.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || format('{0}-{1}', github.ref,
    github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Docker cannot run on macos-latest runners (see .github/macos-docker.md)
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      # A push that changes only plans/, executions/ and holon-knowledge/ skips the steps below; see
      # "Bookkeeping-Only Push Gate" in .github/workflows/README.md.
      - name: Bookkeeping gate
        id: bookkeeping
        uses: ./.github/actions/bookkeeping-gate
        with:
          job-name: integration
          os: ${{ matrix.os }}

      - name: CI Timing Gate (Start)
        uses: ./.github/actions/ci-timing-gate
        with:
          phase: start

      - name: Install uv
        if: steps.bookkeeping.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Set up Docker Buildx
        if: steps.bookkeeping.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4
        with:
          keep-state: true

      - name: Expose GitHub Runtime
        if: steps.bookkeeping.outputs.skip != 'true'
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build all Docker images
        if: steps.bookkeeping.outputs.skip != 'true'
        run: |
          ./apps/sandbox-executor/build_all_images.sh --output-log

      - name: Run integration tests
        if: steps.bookkeeping.outputs.skip != 'true'
        run: |
          uv sync --locked
          uv run pytest -v -l --tb=short -m "integration_test" --junitxml=integration-report.xml

      - name: CI Timing Gate (Check <= 5 min)
        if: always() && steps.bookkeeping.outputs.skip != 'true'
        uses: ./.github/actions/ci-timing-gate
        with:
          phase: check

      - name: Full run completed
        if: steps.bookkeeping.outputs.skip != 'true'
        run: echo "Every step of the full run passed."
