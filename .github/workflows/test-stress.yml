name: Test - Stress

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  # One full run a day, whatever the gate decided on the pushes to main; see "Pushes to main" in README.md.
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: read

# Pushes are keyed by SHA so a later main push never evicts a pending one.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || format('{0}-{1}', github.ref,
    github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workspace-survival:
    name: Workspace survival
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Record job start time
        run: echo "CI_TIMING_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      # A push that changes only plans/, executions/ and holon-knowledge/ skips the steps below; see
      # "Bookkeeping-Only Push Gate" in .github/workflows/README.md.
      - name: Bookkeeping gate
        id: bookkeeping
        uses: ./.github/actions/bookkeeping-gate
        with:
          job-name: Workspace survival
          os: ${{ matrix.os }}

      - name: Install uv
        if: steps.bookkeeping.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Run workspace-survival stress suite
        if: steps.bookkeeping.outputs.skip != 'true'
        # Clones the repository onto the exact path an executor works in (~/.holon-sandbox/workspace
        # with HOME redirected), runs this suite's unit selection from there, and requires the
        # workspace, its .git and its HEAD commit to survive -- an earlier incident deleted the
        # workspace, which pushed executor.py into its destructive git re-initialisation. Also runs
        # the hermetic canary guard (test_sandbox_hermetic_guard.py), which re-runs the whole unit
        # selection under a simulated container HOME and is kept out of the unit matrix for runtime.
        # The canary's child runs only the test modules selected by the rule in
        # tests/stress_selection.py (modules that resolve HOME or the workspace, delete directories, or
        # directly reference a module that does); the survival child still runs the whole unit
        # selection under the same HOME layout, so indirect reach is caught there.
        # The two stress tests run concurrently (-n auto --dist worksteal), each with its own HOME,
        # workspace, TMPDIR and pytest --basetemp (tests/stress_support.py);
        # tests/test_stress_support.py proves the two share none of them. -rP prints the captured
        # output of passing tests, so each child's stress-child timing line reaches the job log.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          uv sync --locked
          time uv run pytest -n auto --dist worksteal -v -l -rP --tb=short -m stress --junitxml=stress-report.xml

      - name: Assert the stress suite really ran
        if: steps.bookkeeping.outputs.skip != 'true'
        # Non-skippable by construction: pytest exits non-zero when nothing is collected, a skipped
        # stress test reports skipped=1, and a stress test that is no longer collected is missing
        # from the named test cases; each fails here instead of passing quietly. The report is
        # parsed rather than grepped, so the check does not depend on junit attribute ordering,
        # quoting, or an extra wrapper element.
        run: |
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("stress-report.xml").getroot()
          totals = {k: 0 for k in ("tests", "skipped", "failures", "errors")}
          for suite in root.iter("testsuite"):
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          names = {case.get("name") for case in root.iter("testcase")}
          # Both stress tests must run: the workspace-survival test and the hermetic canary guard.
          expected = {
              "test_suite_run_from_live_executor_workspace_preserves_workspace_and_history",
              "test_canary_workspace_survives_entrypoint_tests",
          }

          print(f"stress report: {totals}, tests: {sorted(names)}")
          if totals["tests"] < len(expected) or expected - names:
              sys.exit(f"a stress test was not collected: missing {sorted(expected - names)}")
          if totals["skipped"]:
              sys.exit(
                  "a stress test was skipped: its workspace-survival or hermetic guarantee "
                  "was not proven"
              )
          if totals["failures"] or totals["errors"]:
              sys.exit("a stress test failed or errored")
          PY

      - name: Timing gate
        if: steps.bookkeeping.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TIMING_MODE: ${{ github.event_name == 'pull_request' && 'compare' || 'record' }}
          TIMING_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'timing-regression-accepted') }}
        run: |
          python3 scripts/ci_timing_gate.py "$TIMING_MODE" \
            --workflow test-stress --job workspace-survival --os "${{ matrix.os }}" --start "$CI_TIMING_START" \
            --runs 5 --tolerance 0.5 --min-delta 120 --ceiling 900 \
            --junit stress-report.xml --repo "$GITHUB_REPOSITORY" --output ci-timing/record.json \
            --override-label-present "$TIMING_OVERRIDE"

      - name: Upload timing record
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-test-stress-workspace-survival-${{ matrix.os }}
          path: ci-timing/record.json
          retention-days: 30
          # A main push that the gate skipped writes no timing record; a full run without one still fails.
          if-no-files-found: ${{ steps.bookkeeping.outputs.skip != 'true' && 'error' || 'ignore' }}

      - name: Full run completed
        if: steps.bookkeeping.outputs.skip != 'true'
        run: echo "Every step of the full run passed."
