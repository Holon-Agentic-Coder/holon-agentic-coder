name: Test - Unit

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  # One full run a day, whatever the gate decided on the pushes to main; see "Pushes to main" in README.md.
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

# Pushes are keyed by SHA so a later main push never evicts a pending one.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || format('{0}-{1}', github.ref,
    github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    # why: without an explicit name GitHub appends the shard to every leg and renames the unit (ubuntu-latest) check.
    name: unit (${{ matrix.os }}${{ matrix.shards > 1 && format(', {0}', matrix.gate-leg) || '' }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2]
        exclude:
          - os: ubuntu-latest
            shard: 2
        include:
          # Minimum absolute delta over the main baseline median before the relative gate may fail.
          # macOS runners showed a 135.2 s same-code swing (235 s vs 370.2 s), so 150 s keeps pure
          # runner variance below the gate while a real slowdown still exceeds it. ubuntu runs the
          # same suite in ~120 s with no comparable swing, so it keeps the script default of 120 s:
          # the relative gate there deliberately fires only around a doubling, and the 900 s ceiling
          # remains the absolute backstop on both runners (main already reached 594 s on macos-latest
          # as the unit suite grew to ~6,965 tests).
          - os: ubuntu-latest
            timing-min-delta: 120
            shards: 1
            timing-job: unit
            gate-leg: ubuntu-latest
          - os: macos-latest
            timing-min-delta: 150
            shards: 2
          # why: match_job in scripts/ci_bookkeeping_chain.py refuses a name matching two legs, so gate-leg is unique.
          - os: macos-latest
            shard: 1
            timing-job: unit-shard-1
            gate-leg: shard 1 of 2
          - os: macos-latest
            shard: 2
            timing-job: unit-shard-2
            gate-leg: shard 2 of 2

    steps:
      - name: Record job start time
        run: echo "CI_TIMING_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      # A push that changes only plans/, executions/ and holon-knowledge/ skips the steps below; see
      # "Bookkeeping-Only Push Gate" in .github/workflows/README.md.
      - name: Bookkeeping gate
        id: bookkeeping
        uses: ./.github/actions/bookkeeping-gate
        with:
          job-name: unit
          os: ${{ matrix.gate-leg }}

      # A pull request that changes no platform-sensitive path or content skips the macOS leg's steps below; see
      # "macOS Relevance Gate" in .github/workflows/README.md.
      - name: macOS relevance gate
        id: macos_relevance
        if: matrix.os == 'macos-latest' && steps.bookkeeping.outputs.skip != 'true'
        uses: ./.github/actions/macos-relevance-gate

      - name: Install uv
        if: steps.bookkeeping.outputs.skip != 'true' && steps.macos_relevance.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Run unit tests
        if: steps.bookkeeping.outputs.skip != 'true' && steps.macos_relevance.outputs.skip != 'true'
        run: |
          uv sync --locked
          if [ "${{ matrix.shards }}" -gt 1 ]; then
            uv run pytest --collect-only -q -m "not integration_test and not stress" > unit-collection.txt
            python3 scripts/unit_test_shard.py --shard "${{ matrix.shard }}" --shards "${{ matrix.shards }}" < unit-collection.txt > unit-shard-files.txt
            uv run pytest -n auto --dist worksteal -v -l --tb=short -m "not integration_test and not stress" --junitxml=unit-report.xml @unit-shard-files.txt
          else
            uv run pytest -n auto --dist worksteal -v -l --tb=short -m "not integration_test and not stress" --junitxml=unit-report.xml
          fi

      - name: CI Timing Gate (compare with main)
        if: steps.bookkeeping.outputs.skip != 'true' && steps.macos_relevance.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TIMING_MODE: ${{ github.event_name == 'pull_request' && 'compare' || 'record' }}
          TIMING_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'timing-regression-accepted') }}
        run: |
          python3 scripts/ci_timing_gate.py "$TIMING_MODE" \
            --workflow test-unit --job "${{ matrix.timing-job }}" --os "${{ matrix.os }}" --start "$CI_TIMING_START" \
            --runs 5 --tolerance 0.5 --min-delta "${{ matrix.timing-min-delta }}" --ceiling 900 \
            --junit unit-report.xml --repo "$GITHUB_REPOSITORY" --output ci-timing/record.json \
            --override-label-present "$TIMING_OVERRIDE"

      - name: Upload timing record
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-test-unit-${{ matrix.timing-job }}-${{ matrix.os }}
          path: ci-timing/record.json
          retention-days: 30
          # A main push that the gate skipped writes no timing record; a full run without one still fails.
          if-no-files-found: ${{ steps.bookkeeping.outputs.skip != 'true' && 'error' || 'ignore' }}

      - name: Full run completed
        if: steps.bookkeeping.outputs.skip != 'true' && steps.macos_relevance.outputs.skip != 'true'
        run: echo "Every step of the full run passed."
