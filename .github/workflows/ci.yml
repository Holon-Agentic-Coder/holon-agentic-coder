name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Lint and format check with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: |
          uv lock --check
          uv run pytest -m "not integration_test"
