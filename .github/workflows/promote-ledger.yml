name: Promote Ledger

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Promote whatever the root-intent threshold"
        type: boolean
        required: false
        default: false

# why: the push uses the bot token from the checkout, never GITHUB_TOKEN, so the default token stays read-only.
permissions:
  contents: read

concurrency:
  group: promote-ledger
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # why: secrets cannot appear in an if:; every step tests this variable instead and never prints it.
      HOLON_LEDGER_BOT_TOKEN: ${{ secrets.HOLON_LEDGER_BOT_TOKEN }}

    steps:
      - name: Read pending ledger directory
        if: env.HOLON_LEDGER_BOT_TOKEN == ''
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: holon-knowledge/ledger/pending

      - name: Warn on missing bot token and pending backlog
        if: env.HOLON_LEDGER_BOT_TOKEN == ''
        run: |
          set -euo pipefail
          pending_dir="holon-knowledge/ledger/pending"
          pending_count=0
          if [ -d "${pending_dir}" ]; then
            pending_count="$(find "${pending_dir}" -type f -name '*.jsonl' | wc -l | tr -d ' ')"
          fi
          reason="Ledger promotion skipped with ${pending_count} pending fragment(s) under ${pending_dir}: repository secret HOLON_LEDGER_BOT_TOKEN is not configured. Maintainer action required: configure HOLON_LEDGER_BOT_TOKEN per .github/workflows/README.md (Ledger Promotion)."
          echo "::warning::${reason}"
          echo "${reason}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout repository
        if: env.HOLON_LEDGER_BOT_TOKEN != ''
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.HOLON_LEDGER_BOT_TOKEN }}

      - name: CI Timing Gate (Start)
        if: env.HOLON_LEDGER_BOT_TOKEN != ''
        uses: ./.github/actions/ci-timing-gate
        with:
          phase: start

      - name: Install uv
        if: env.HOLON_LEDGER_BOT_TOKEN != ''
        uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: env.HOLON_LEDGER_BOT_TOKEN != ''
        run: uv sync --locked

      - name: Promote pending ledger fragments
        if: env.HOLON_LEDGER_BOT_TOKEN != ''
        env:
          # why: the input reaches the shell through the environment only, never interpolated into the script.
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          args=()
          if [ "${FORCE}" = "true" ]; then
            args+=(--force)
          fi
          uv run holon ledger promote "${args[@]}"

      - name: Fail on changes outside holon-knowledge/ledger/
        id: guard
        if: env.HOLON_LEDGER_BOT_TOKEN != ''
        run: |
          set -euo pipefail
          # why: git status renames emit "old -> new", so splitting ensures both paths are checked against the ledger prefix.
          paths="$(git status --porcelain=v1 -uall | cut -c4- | sed 's/ -> /\n/')"
          if [ -z "${paths}" ]; then
            echo "Nothing to promote (below the threshold or no pending fragments)."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          outside="$(printf '%s\n' "${paths}" | grep -v '^holon-knowledge/ledger/' || true)"
          if [ -n "${outside}" ]; then
            while IFS= read -r path; do
              printf '::error::Ledger promotion changed a path outside holon-knowledge/ledger/: %s\n' "${path}"
            done <<< "${outside}"
            exit 1
          fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Commit and push the promotion
        if: env.HOLON_LEDGER_BOT_TOKEN != '' && steps.guard.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "holon-ledger-bot"
          git config user.email "holon-ledger-bot@users.noreply.github.com"
          git add -A -- holon-knowledge/ledger
          git commit -m "chore(ledger): promote pending fragments [ledger-promote]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              break
            fi
            echo "::warning::Push attempt ${attempt} of 3 was rejected; fetching and rebasing onto origin/main."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Rebasing the promotion commit onto origin/main conflicted; nothing is resolved by hand."
              exit 1
            fi
            sleep 5
          done
          echo "::error::Ledger promotion push failed after 3 attempts."
          exit 1

      - name: CI Timing Gate (Check <= 10 min)
        if: always() && env.HOLON_LEDGER_BOT_TOKEN != ''
        uses: ./.github/actions/ci-timing-gate
        with:
          phase: check
          max-seconds: 600
