name: Test - Hygiene

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

# Pushes are keyed by SHA so a later main push never evicts a pending one.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || format('{0}-{1}', github.ref,
    github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
          # Full history, so the module budget check finds the merge base with origin/main.
          fetch-depth: 0

      # A push that changes only plans/, executions/ and holon-knowledge/ skips the steps below; see
      # "Bookkeeping-Only Push Gate" in .github/workflows/README.md.
      - name: Bookkeeping gate
        id: bookkeeping
        uses: ./.github/actions/bookkeeping-gate
        with:
          job-name: hygiene
          os: ${{ matrix.os }}

      - name: CI Timing Gate (Start)
        uses: ./.github/actions/ci-timing-gate
        with:
          phase: start

      - name: Install uv
        if: steps.bookkeeping.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Check uv.lock is up to date
        if: steps.bookkeeping.outputs.skip != 'true'
        run: |
          uv lock --check
          git diff --exit-code uv.lock

      - name: Check sandbox-executor uv.lock is up to date
        if: steps.bookkeeping.outputs.skip != 'true'
        working-directory: apps/sandbox-executor
        run: |
          uv lock --check
          git diff --exit-code uv.lock

      - name: Install dependencies
        if: steps.bookkeeping.outputs.skip != 'true'
        run: uv sync --locked

      - name: Lint with Ruff
        if: steps.bookkeeping.outputs.skip != 'true'
        run: uv run ruff check .

      - name: Check formatting with Ruff
        if: steps.bookkeeping.outputs.skip != 'true'
        run: uv run ruff format --check .

      - name: Check module budgets
        if: steps.bookkeeping.outputs.skip != 'true'
        env:
          # The budget configuration is frozen: only the maintainer's module-budget-change label authorises a change.
          MODULE_BUDGET_CHANGE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'module-budget-change') }}
        run: |
          if [ "$MODULE_BUDGET_CHANGE_LABEL" = "true" ]; then export HOLON_ALLOW_MODULE_BUDGET_CHANGE=1; fi
          uv run python scripts/check_module_budgets.py

      - name: Check module budget label actor
        if: steps.bookkeeping.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # why: every hygiene step's if: must be exactly the bookkeeping guard, so the pull_request test lives in the shell.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            uv run python scripts/check_module_budget_label_actor.py --pr "$PULL_REQUEST_NUMBER" --repo "$GITHUB_REPOSITORY" --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

      - name: Check self-explaining code
        if: steps.bookkeeping.outputs.skip != 'true'
        run: uv run python scripts/check_self_explaining.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check JSON and JSONL files (bookkeeping-only push)
        if: steps.bookkeeping.outputs.skip == 'true'
        run: make lint-json

      - name: Check markdown formatting (bookkeeping-only push)
        if: steps.bookkeeping.outputs.skip == 'true'
        run: make lint-md

      - name: Install system linters
        if: steps.bookkeeping.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run Makefile lint
        if: steps.bookkeeping.outputs.skip != 'true'
        env:
          # make lint runs task lint, which re-runs the module budget check: it needs the same authorisation.
          HOLON_ALLOW_MODULE_BUDGET_CHANGE:
            ${{ contains(github.event.pull_request.labels.*.name, 'module-budget-change') && '1' || '0' }}
        run: make lint

      - name: Test clean task
        if: steps.bookkeeping.outputs.skip != 'true'
        run: uv run task clean

      - name: CI Timing Gate (Check <= 5 min)
        if: always() && steps.bookkeeping.outputs.skip != 'true'
        uses: ./.github/actions/ci-timing-gate
        with:
          phase: check

      - name: Full run completed
        if: steps.bookkeeping.outputs.skip != 'true'
        run: echo "Every step of the full run passed."
