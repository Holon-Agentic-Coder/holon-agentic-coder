name: Test - Integration

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Docker cannot run on macos-latest runners (see .github/macos-docker.md)
        os: [ubuntu-latest]

    steps:
      - name: Record job start time
        run: echo "CI_TIMING_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          keep-state: true

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build all Docker images
        run: |
          ./apps/sandbox-executor/build_all_images.sh --output-log

      - name: Run integration tests
        run: |
          uv sync --locked
          uv run pytest -v -l --tb=short -m "integration_test" --junitxml=integration-report.xml

      - name: Timing gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TIMING_MODE: ${{ github.event_name == 'pull_request' && 'compare' || 'record' }}
          TIMING_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'timing-regression-accepted') }}
        run: |
          python3 scripts/ci_timing_gate.py "$TIMING_MODE" \
            --workflow test-integration --job integration --os "${{ matrix.os }}" --start "$CI_TIMING_START" \
            --runs 5 --tolerance 0.5 --min-delta 120 --ceiling 600 \
            --junit integration-report.xml --repo "$GITHUB_REPOSITORY" --output ci-timing/record.json \
            --override-label-present "$TIMING_OVERRIDE"

      - name: Upload timing record
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-test-integration-integration-${{ matrix.os }}
          path: ci-timing/record.json
          retention-days: 30
          if-no-files-found: error
