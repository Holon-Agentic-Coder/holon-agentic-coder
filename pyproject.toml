[project]
name = "holon-agentic-coder"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "holon",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "taskipy==1.14.1",
    "ruff==0.15.20",
]

[workspace]
members = [
    "apps/sandbox-executor",
]

[tool.uv.sources]
holon = { path = "apps/sandbox-executor", editable = true }

[tool.taskipy.tasks]
clean = 'find . -name ".git" -prune -o -path "./.venv" -prune -o -type d \( -name "__pycache__" -o -name ".pytest_cache" -o -name ".ruff_cache" -o -name "*.egg-info" -o -name "build" -o -name "dist" -o -name ".mypy_cache" \) -exec rm -rf {} + && rm -rf .coverage coverage.xml htmlcov apps/sandbox-executor/build_all_images.log build_all_images.log'
lint = "uv lock --check && git diff --exit-code uv.lock && ruff check . && ruff format --check ."
lint-docs = 'npx prettier --check "**/*.md"'
check = "task lint && task lint-docs"
format-code = "ruff check --fix . && ruff format ."
format-docs = 'npx prettier --write "**/*.md"'
format = "task format-code && task format-docs"
test = 'pytest -m "not integration_test and not stress"'

[tool.pytest.ini_options]
testpaths = ["apps/sandbox-executor/tests"]
pythonpath = ["apps/sandbox-executor/src"]
# Unknown markers are only a warning by default, which is how a typo'd or unregistered marker can
# sit silently outside every -m selection. Fail the run instead.
addopts = ["--strict-markers"]
markers = [
    "integration_test: marks tests as integration tests",
    "stress: marks long-running workspace-survival checks that run the suite from a live executor workspace",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["holon-coherence"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # Pyflakes
    "I", # isort (import sorting)
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = []
